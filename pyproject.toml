[project]
name = "tableau-authoring-mcp"
version = "0.1.0"
description = "MCP server that inspects, validates, patches and generates local Tableau files."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2,<3",
    "lxml>=5.3",
    "pydantic>=2.8",
]

[project.scripts]
tableau-authoring-mcp = "tableau_authoring_mcp.server:main"
tam = "tableau_authoring_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "anyio>=4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tableau_authoring_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["corpus: needs the local corpus (set TAM_CORPUS)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"spikes/**" = ["E501"]  # verbatim Tableau XML
